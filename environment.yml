# Scientific Python packages match the saved results. Python 3.11.8 allows
# the original R 3.6.3/reference BLAS runtime in the same environment.
# Run `make system-deps` first on Debian/Ubuntu for the LaTeX figure tools
# listed in system-requirements.txt (these are system packages, not pip packages).
# Run `make environment` to also install the pinned CHIRAL R package.
# Install genuine Helvetica separately, or put its font files in fonts/Helvetica/.
# See fonts/README.md. Substitution is disabled.
# `make check-env` validates Helvetica and actual LaTeX PDF/SVG/PNG rendering.
name: sep_2026
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - python=3.11.8
  - pip
  - git
  - r-base=3.6.3
  - r-matrix=1.2_18
  - bioconductor-biobase=2.46.0
  - r-remotes=2.3.0
  - libblas=3.9.0=*netlib
  - liblapack=3.9.0=*netlib
  - pip:
      - contourpy==1.3.3
      - cycler==0.12.1
      - elpigraph-python==0.3.2
      - et_xmlfile==2.0.0
      - fonttools==4.63.0
      - igraph==1.0.0
      - joblib==1.5.3
      - kiwisolver==1.5.1
      - llvmlite==0.49.0
      - matplotlib==3.11.1
      - narwhals==2.25.0
      - networkx==3.6.1
      - numba==0.67.0
      - numpy==2.4.6
      - openpyxl==3.1.5
      - pandas==2.3.3
      - pillow==12.3.0
      - pynndescent==0.6.0
      - pyparsing==3.3.2
      - python-dateutil==2.9.0.post0
      - python-igraph==1.0.0
      - pytz==2026.3.post1
      - scikit-learn==1.9.0
      - scipy==1.17.1
      - shapely==2.1.2
      - six==1.17.0
      - texttable==1.7.0
      - threadpoolctl==3.6.0
      - tqdm==4.70.0
      - tzdata==2026.3
      - umap-learn==0.5.9.post2
      - clrcycle @ git+https://github.com/pachterlab/clrcycle.git@d051fca3e195a9c15f6289902f8ff2829c79addd
